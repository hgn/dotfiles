# fuzzel - Tokyo Night (devnull 4K dmenu for cliphist / audio-output)
[main]
font=JetBrainsMono Nerd Font:size=17
dpi-aware=no
prompt="❯   "
icons-enabled=yes
icon-theme=Adwaita
terminal=kitty -1 --instance-group=main -e
layer=overlay
width=56
lines=12
horizontal-pad=32
vertical-pad=24
inner-pad=14
line-height=34
letter-spacing=0.3
exit-on-keyboard-focus-loss=yes
match-counter=yes

[colors]
background=1a1b26ee
text=a9b1d6ff
prompt=bb9af7ff
placeholder=565f89ff
input=c0caf5ff
match=bb9af7ff
selection=283457ee
selection-text=e0e6ffff
selection-match=7dcfffff
counter=565f89ff
border=bb9af7cc

[border]
width=2
radius=20
