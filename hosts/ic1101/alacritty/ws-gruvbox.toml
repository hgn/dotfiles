# per-workspace terminal theme "gruvbox" (Hyprland ALT+Return), local file
[general]
import = ["~/.config/alacritty/wm.toml"]

[window]
opacity = 1.0

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
cursor = "#fabd2f"
text = "#282828"

[colors.selection]
background = "#504945"
text = "CellForeground"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
