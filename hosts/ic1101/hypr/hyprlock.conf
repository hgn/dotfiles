# hyprlock - Amethyst Synthwave (ic1101, 2160x1350)
# Composed around the active wallpaper: large Inter Display clock in the dark
# night sky above the sun, open horizon in the middle, sleek amethyst glass
# password/fingerprint pill & status bar over the neon grid at the bottom.

$font        = Inter
$fontDisplay = Inter Display

general {
    hide_cursor = true
    grace = 3
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = 󰈷  Finger auflegen oder Passwort
        present_message = 󰈷  Prüfe Fingerabdruck …
    }
}

animations {
    enabled = true
    bezier = smooth, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
}

# Active wallpaper with a gentle cinematic blur (keeps sun, stars & neon grid crisp)
background {
    monitor =
    path = /home/pfeifer/.local/share/wm/wallpaper
    blur_passes = 2
    blur_size = 3
    noise = 0.008
    contrast = 1.02
    brightness = 0.86
    vibrancy = 0.20
    vibrancy_darkness = 0.08
}

# ---- Top sky: date + large airy clock (leaves the sun completely unobstructed) ----
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.utf8 date +"%A, %d. %B"
    font_size = 24
    font_family = $font Medium
    color = rgba(bb9af7ee)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(080512bb)
    position = 0, -90
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    font_size = 172
    font_family = $fontDisplay Light
    color = rgba(f4f0fff5)
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(bb9af755)
    position = 0, -132
    halign = center
    valign = top
}

# ---- Sleek amethyst glass password + fingerprint pill ----
input-field {
    monitor =
    size = 400, 54
    outline_thickness = 2
    rounding = 27
    dots_size = 0.24
    dots_spacing = 0.34
    dots_center = true
    inner_color = rgba(120d22a6)
    outer_color = rgba(bb9af7aa) rgba(ff7edb88) 45deg
    check_color = rgba(7dcfffcc) rgba(bb9af7cc) 120deg
    fail_color = rgba(f7768edd) rgba(ff7edbcc) 40deg
    capslock_color = rgba(e0af68ee)
    font_color = rgba(f4f0ffff)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##c4b5f5cc">$FPRINTPROMPT</span>
    fail_text = <span foreground="##f7768eee">$FAIL ($ATTEMPTS)</span>
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(080512aa)
    position = 0, 175
    halign = center
    valign = bottom
}

# ---- Subtle bottom status glass pill (user@host · layout · battery) ----
shape {
    monitor =
    size = 400, 38
    color = rgba(120d2285)
    rounding = 19
    border_size = 1
    border_color = rgba(bb9af748)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(08051288)
    position = 0, 44
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $USER@ic1101
    font_size = 13
    font_family = $font Medium
    color = rgba(c0caf5cc)
    position = -120, 54
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    font_size = 13
    font_family = $font Medium
    color = rgba(bb9af7dd)
    position = 12, 54
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] cap=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null); st=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); [ "$st" = "Charging" ] && ic="󰂄" || ic="󰁹"; echo "$ic  ${cap}%"
    font_size = 13
    font_family = $font Medium
    color = rgba(c0caf5dd)
    position = 138, 54
    halign = center
    valign = bottom
}
