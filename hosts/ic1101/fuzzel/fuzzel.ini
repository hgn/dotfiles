# fuzzel - Tokyo Night
[main]
font=JetBrainsMono Nerd Font:size=15
dpi-aware=no
prompt="❯   "
icons-enabled=yes
icon-theme=Adwaita
terminal=alacritty --config-file /home/pfeifer/.config/alacritty/wm.toml -e
layer=overlay
width=42
lines=10
horizontal-pad=28
vertical-pad=20
inner-pad=12
line-height=30
letter-spacing=0.3
exit-on-keyboard-focus-loss=yes
match-counter=yes

[colors]
background=1a1b26ee
text=a9b1d6ff
