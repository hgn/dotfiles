# hypridle - used by Hyprland and niri
# Timeouts count from the last input. "--locked" rules only act while hyprlock runs.
$idle = /home/pfeifer/.local/share/wm/bin/wm-idle

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $idle on
    ignore_dbus_inhibit = false
}

# ---- locked (Super+L and walked away): quick ----
listener {
    timeout = 10
    on-timeout = $idle dim --locked
    on-resume = $idle undim
}
listener {
    timeout = 45
    on-timeout = $idle off --locked
    on-resume = $idle on
}
listener {
    timeout = 120
    on-timeout = $idle suspend --locked
}

# ---- normal use: relaxed ----
listener {
    timeout = 150
    on-timeout = $idle dim
    on-resume = $idle undim
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
listener {
    timeout = 330
    on-timeout = $idle off
    on-resume = $idle on
}
listener {
    timeout = 1200
    on-timeout = $idle suspend
}
