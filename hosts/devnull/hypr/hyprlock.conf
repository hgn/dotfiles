# hyprlock - desktop "devnull"
# Same language as the Quickshell power menu: frosted screen, one glass card
# in the middle with a soft blue/violet glow, clock + date + greeting, the
# password field inside the card; now playing and status along the bottom.
# Backup of the previous version: brain scratch/backup/hyprlock.conf
$font   = JetBrainsMono Nerd Font
$fg     = rgb(c0caf5)
$dim    = rgb(565f89)
$blue   = rgb(7aa2f7)
$purple = rgb(bb9af7)
$cyan   = rgb(7dcfff)
$yellow = rgb(e0af68)
$red    = rgb(f7768e)

general {
    hide_cursor = true
    grace = 3
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = outback, 0.34, 1.4, 0.64, 1
    animation = fadeIn, 1, 7, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
    animation = inputFieldColors, 1, 4, smooth
    animation = inputFieldWidth, 1, 3, outback
}

# frosted, darkened screenshot of the desktop
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    noise = 0.015
    contrast = 0.9
    brightness = 0.42
    vibrancy = 0.22
    vibrancy_darkness = 0.15
}

# ---- glass card ---------------------------------------------------------------
# the blurred shadow doubles as the coloured glow around the card
shape {
    monitor =
    size = 860, 700
    rounding = 34
    color = rgba(13141dc8)
    border_size = 2
    border_color = rgba(7aa2f7aa) rgba(bb9af7aa) rgba(7dcfff88) 45deg
    shadow_passes = 3
    shadow_size = 24
    shadow_color = rgba(7aa2f750)
    shadow_boost = 1.4
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# highlight along the top edge of the card
shape {
    monitor =
    size = 420, 2
    rounding = 1
    color = rgba(c0caf555)
    border_size = 0
    position = 0, 349
    halign = center
    valign = center
    zindex = 1
}

# clock
label {
    monitor =
    text = $TIME
    font_size = 132
    font_family = $font ExtraBold
    color = rgba(ffffffee)
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(7aa2f777)
    position = 0, 185
    halign = center
    valign = center
    zindex = 2
}

# date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.utf8 date +"%A, %-d. %B"
    font_size = 26
    font_family = $font Medium
    color = $purple
    position = 0, 68
    halign = center
    valign = center
    zindex = 2
}

# divider
shape {
    monitor =
    size = 620, 1
    rounding = 0
    color = rgba(ffffff14)
    border_size = 0
    position = 0, 18
    halign = center
    valign = center
    zindex = 2
}

# greeting
label {
    monitor =
    text = <span foreground="##7aa2f7">󰌾</span>   Willkommen zurück, <b>$USER</b>
    font_size = 19
    font_family = $font
    color = $fg
    position = 0, -42
    halign = center
    valign = center
    zindex = 2
}

# password
input-field {
    monitor =
    size = 600, 74
    outline_thickness = 2
    rounding = 18
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(0d0e15e6)
    outer_color = $blue $purple 45deg
    check_color = $cyan $blue 120deg
    fail_color = $red $purple 40deg
    capslock_color = $yellow
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">  Passwort</span>
    fail_text = <span foreground="##f7768e">  $FAIL ($ATTEMPTS)</span>
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(00000099)
    position = 0, -150
    halign = center
    valign = center
    zindex = 2
}

# hint below the field, inside the card
label {
    monitor =
    text = ↵ entsperren   ·   Esc leeren   ·   Rahmen gelb = Feststelltaste
    font_size = 12
    font_family = $font
    color = $dim
    position = 0, -270
    halign = center
    valign = center
    zindex = 2
}

# ---- bottom ------------------------------------------------------------------
# host · uptime
label {
    monitor =
    text = cmd[update:30000] echo "󰍹  $(cat /etc/hostname)   ·   󰔟  läuft seit $(uptime -p | sed 's/^up //; s/ hours\?/h/; s/ minutes\?/min/; s/ days\?/d/; s/,//g')"
    font_size = 13
    font_family = $font
    color = $dim
    position = 0, 50
    halign = center
    valign = bottom
}
