# Yazi configuration (shared across devnull & ic1101)
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]

[preview]
wrap            = "no"
tab_size        = 4
max_width       = 1600
max_height      = 1600
image_delay     = 20
image_filter    = "triangle"
image_quality   = 80

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "nvim" },
]
pdf = [
    { run = 'setsid -f papers "$@" >/dev/null 2>&1 </dev/null', orphan = true, desc = "papers" },
]
image = [
    { run = 'setsid -f feh --auto-zoom "$@" >/dev/null 2>&1 </dev/null', orphan = true, desc = "feh" },
]
video = [
    { run = 'setsid -f mpv "$@" >/dev/null 2>&1 </dev/null', orphan = true, desc = "mpv" },
]
audio = [
    { run = 'mpv --no-video "$@"', block = true, desc = "mpv (audio)" },
]
browser = [
    { run = 'setsid -f firefox "$@" >/dev/null 2>&1 </dev/null', orphan = true, desc = "firefox" },
]
open = [
    { run = 'setsid -f xdg-open "$1" >/dev/null 2>&1 </dev/null', orphan = true, desc = "xdg-open" },
]

[open]
rules = [
    { url = "*/", use = ["open", "edit"] },
    { mime = "application/pdf", use = ["pdf", "open"] },
    { url = "*.pdf", use = ["pdf", "open"] },
    { mime = "image/*", use = ["image", "open"] },
    { mime = "video/*", use = ["video", "open"] },
    { mime = "audio/*", use = ["audio", "open"] },
    { mime = "text/html", use = ["browser", "edit"] },
    { mime = "text/*", use = ["edit", "open"] },
    { mime = "application/{json,ndjson,toml,xml,yaml,javascript}", use = ["edit", "open"] },
    { mime = "inode/empty", use = ["edit"] },
    { url = "*", use = ["open", "edit"] },
]
