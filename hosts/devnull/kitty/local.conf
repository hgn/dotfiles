# kitty overrides for the desktop "devnull" (included from the shared kitty.conf)
# JetBrainsMono Nerd Font is installed in ~/.local/share/fonts; 17.5 pt keeps
# roughly the column width of Inconsolata 21 on the 4K screen.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        17.5

# Cursor: breathes instead of hard blinking and settles after 30 s, so an
# idle terminal causes no redraws at all. No cursor trail (tried, not wanted).
cursor_blink_interval        0.9 ease-in-out
cursor_stop_blinking_after   30.0

# Bell: no sound, the window pulses softly in violet instead
enable_audio_bell    no
visual_bell_duration 0.7 ease-out
visual_bell_color    #bb9af7
window_alert_on_bell yes

# Air: a little line spacing and a wider inner margin
modify_font          cell_height 112%
window_padding_width 18 26
