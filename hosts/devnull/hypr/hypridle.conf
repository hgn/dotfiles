# hypridle - desktop "devnull"
# Mirrors the GNOME settings here: lock after 15 minutes, never suspend on its own.
# No backlight on an HDMI monitor, so no dimming; the screen just goes off.
$idle = /home/pfeifer/.local/share/wm/bin/wm-idle

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $idle on
    ignore_dbus_inhibit = false
}

# locked (Super+L and walked away): screen off after a minute
listener {
    timeout = 60
    on-timeout = $idle off --locked
    on-resume = $idle on
}

# normal use
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
listener {
    timeout = 960
    on-timeout = $idle off
    on-resume = $idle on
}
