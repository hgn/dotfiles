# hyprlock - Tokyo Night (Hyprland + niri)
$font = JetBrainsMono Nerd Font
$fg = rgb(c0caf5)
$blue = rgb(7aa2f7)
$purple = rgb(bb9af7)
$cyan = rgb(7dcfff)
$red = rgb(f7768e)

general {
    hide_cursor = true
    grace = 3
    ignore_empty_input = false   # Enter on empty field = scan face again (Howdy)
}

auth {
    fingerprint {
        enabled = true
        ready_message = 󰈷  Gesicht (Enter), Finger oder Passwort
        present_message = 󰈷  Prüfe Fingerabdruck …
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 6, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

# big clock
label {
    monitor =
    text = $TIME
    font_size = 150
    font_family = $font ExtraBold
    color = rgba(c0caf5ee)
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(7aa2f766)
    position = 0, 260
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.utf8 date +"%A, %d. %B"
    font_size = 30
    font_family = $font Medium
    color = rgba(bb9af7ee)
    position = 0, 120
    halign = center
    valign = center
}

# greeting
label {
    monitor =
    text =    $USER
    font_size = 20
    font_family = $font
    color = rgba(a9b1d6dd)
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 520, 76
    outline_thickness = 3
    rounding = 38
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(1a1b26cc)
    outer_color = $blue $purple 45deg
    check_color = $cyan $blue 120deg
    fail_color = $red $purple 40deg
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">$FPRINTPROMPT</span>
    fail_text = <span foreground="##f7768e">$FAIL ($ATTEMPTS)</span>
    capslock_color = rgb(e0af68)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000088)
    position = 0, -130
    halign = center
    valign = center
}

# battery + keyboard layout, bottom
label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT0/capacity) %"
    font_size = 16
    font_family = $font
    color = rgba(565f89ff)
    position = 0, 50
    halign = center
    valign = bottom
}
